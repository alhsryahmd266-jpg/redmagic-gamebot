name: Build GameBot APK
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Fetch detector model (EfficientDet-Lite0, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite
          ls -la app/src/main/assets
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gamebot.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/gamebot.p12" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          tail -n 300 build.log > /tmp/build_tail.log || echo "no log" > /tmp/build_tail.log
          git config user.name gh-actions && git config user.email actions@github.com
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build_tail.log build.log
          git add build.log && git commit -q -m "build log run ${{ github.run_number }}"
          git push -f origin ci-logs
      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameBot build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
